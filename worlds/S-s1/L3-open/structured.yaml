concepts:
- term: requester
  binding: req.requester
  english: The requester of a request is the employee who raised it.
- term: requester's cost centre
  binding: emp.cc
  english: A requester's cost centre is the cost centre recorded for them in emp.
- term: pending request
  binding: req.status = pending
  english: A pending request is one whose status is pending. Cancelled requests are neither pending nor booked.
- term: booked amount
  binding: booked.amount
  english: The booked amount of a cost centre is what is booked directly on it. Its booked total is defined separately (R104).
- term: cap
  binding: cap.amount
  english: The cap of a cost centre bounds its committed spend (R106).
- term: manager
  binding: reports.manager
  english: An employee's manager is their direct manager only. Their reporting chain (R103) goes further up.
- term: organisational unit
  binding: org_unit.unit
  english: The organisational unit of a cost centre is a grouping of cost centres. An employee's department is defined separately (R113).
rules:
- id: R101
  defines: cc_anc/2
  meaning: 'cc_anc(C, A): A is an ancestor of cost centre C (parent, parent''s parent, ...).'
  class: definitional
  conservative: true
  owner: null
  rule: The ancestors of a cost centre are its parent, its parent's parent, and so on.
- id: R102
  defines: in_subtree/2
  meaning: 'in_subtree(C, Root): C is Root or a descendant of Root.'
  class: definitional
  conservative: true
  owner: null
  rule: A cost centre lies in the subtree of a cost centre X if it is X or one of X's descendants.
- id: R103
  defines: chain/2
  meaning: 'chain(E, M): M is in E''s reporting chain (manager, manager''s manager, ...).'
  class: definitional
  conservative: true
  owner: null
  rule: An employee's reporting chain is their manager, their manager's manager, and so on. It does not include the employee.
- open_question: c6
  term: booked total
  owner: controller
  question: Does the booked total of a cost centre include what is booked on its descendants, or only what is booked directly on it?
  decided: null
  readings:
  - reading: with_descendants
    id: R104
    defines: booked_total/2
    meaning: 'booked_total(C, T): T is the booked amount of C and all its descendants.'
    class: definitional
    conservative: true
    owner: controller
    rule: The booked total of a cost centre is the sum of the booked amounts of every cost centre in its subtree (zero where nothing is booked).
    reading_of: c6
  - reading: direct_only
    id: R104b
    defines: booked_total/2
    meaning: 'booked_total(C, T): T is the booked amount of C and all its descendants.'
    class: definitional
    conservative: true
    owner: controller
    rule: The booked total of a cost centre is its own booked amount, not counting its descendants (zero where nothing is booked).
    reading_of: c6
- id: R105
  defines: pending_total/2
  meaning: 'pending_total(C, P): P is the amount of pending requests raised in C or its descendants.'
  class: definitional
  conservative: true
  owner: null
  rule: The pending total of a cost centre is the sum of the amounts of pending requests whose requester's cost centre lies in its subtree.
- open_question: c1
  term: committed spend
  owner: controller
  question: Does the committed spend of a cost centre include pending requests?
  decided: null
  readings:
  - reading: booked_only
    id: R106
    defines: committed/2
    meaning: 'committed(C, T): T is the committed spend of cost centre C.'
    class: definitional
    conservative: true
    owner: controller
    rule: The committed spend of a cost centre is its booked total. Pending requests do not count.
    reading_of: c1
  - reading: with_pending
    id: R106b
    defines: committed/2
    meaning: 'committed(C, T): T is the committed spend of cost centre C.'
    class: definitional
    conservative: true
    owner: controller
    rule: The committed spend of a cost centre is its booked total plus its pending total.
    reading_of: c1
- id: R107
  defines: headroom/2
  meaning: 'headroom(C, H): H is C''s cap minus its committed spend.'
  class: definitional
  conservative: true
  owner: null
  rule: The headroom of a cost centre is its cap minus its committed spend.
- id: R108
  defines: over_cap/1
  meaning: 'over_cap(C): C''s committed spend exceeds its cap.'
  class: definitional
  conservative: true
  owner: null
  rule: A cost centre is over cap if its committed spend exceeds its cap.
- open_question: c4
  term: cap scope
  owner: controller
  question: Does a request's cap check cover only the requester's cost centre, or also every ancestor of it?
  decided: null
  readings:
  - reading: with_ancestors
    id: R109
    defines: cap_scope/2
    meaning: 'cap_scope(R, C): cost centre C''s cap applies to request R.'
    class: definitional
    conservative: true
    owner: controller
    rule: A request's cap scope is its requester's cost centre and every ancestor of that cost centre.
    reading_of: c4
  - reading: own_only
    id: R109b
    defines: cap_scope/2
    meaning: 'cap_scope(R, C): cost centre C''s cap applies to request R.'
    class: definitional
    conservative: true
    owner: controller
    rule: A request's cap scope is its requester's cost centre only.
    reading_of: c4
- id: R110
  defines: exposure/3
  meaning: 'exposure(R, C, X): X is what C would have committed if R were approved.'
  class: definitional
  conservative: true
  owner: null
  rule: A request's exposure at a cost centre in its cap scope is that centre's committed spend plus the request amount, not counting the request itself twice if committed spend already includes it.
- id: R111
  defines: cap_breach/1
  meaning: 'cap_breach(R): approving R would exceed the cap of a cost centre in its cap scope.'
  class: definitional
  conservative: true
  owner: null
  rule: A request breaches a cap if its exposure at some cost centre in its cap scope exceeds that centre's cap.
- id: R112
  defines: big_capital/1
  meaning: 'big_capital(R): R is a capital request over 50000.'
  class: definitional
  conservative: true
  owner: null
  rule: A big capital request is a capital request whose amount is over 50000.
- open_question: c3
  term: department
  owner: hr
  question: Is an employee's department their cost centre or their cost centre's organisational unit?
  decided: null
  readings:
  - reading: cost_centre
    id: R113
    defines: dept/2
    meaning: 'dept(E, D): D is employee E''s department.'
    class: definitional
    conservative: true
    owner: hr
    rule: An employee's department is their cost centre.
    reading_of: c3
  - reading: org_unit
    id: R113b
    defines: dept/2
    meaning: 'dept(E, D): D is employee E''s department.'
    class: definitional
    conservative: true
    owner: hr
    rule: An employee's department is the organisational unit of their cost centre.
    reading_of: c3
- id: R114
  defines: headcount/2
  meaning: 'headcount(D, N): N employees belong to department D.'
  class: definitional
  conservative: true
  owner: null
  rule: The headcount of a department is the number of employees whose department it is.
- open_question: c2
  term: governing date
  owner: procurement
  question: Which date governs a request's dated rules (approval limits, vendor status, exemptions), the request date or today?
  decided: null
  readings:
  - reading: request_date
    id: R201
    defines: governing_date/2
    meaning: 'governing_date(R, D): D is the date that governs request R''s dated rules.'
    class: temporal
    conservative: true
    owner: procurement
    rule: A request's dated rules (approval limits, vendor status, exemptions) are read as of the date the request was raised.
    reading_of: c2
  - reading: today
    id: R201b
    defines: governing_date/2
    meaning: 'governing_date(R, D): D is the date that governs request R''s dated rules.'
    class: temporal
    conservative: true
    owner: procurement
    rule: A request's dated rules (approval limits, vendor status, exemptions) are read as of today.
    reading_of: c2
- id: R202
  defines: limit_on/3
  meaning: 'limit_on(Role, L, D): L is the approval limit of Role on date D.'
  class: temporal
  conservative: true
  owner: null
  rule: A role's approval limit on a date is the limit of the version valid on that date.
- id: R203
  defines: vendor_status_on/3
  meaning: 'vendor_status_on(V, S, D): vendor V has status S on date D.'
  class: temporal
  conservative: true
  owner: null
  rule: A vendor's status on a date is the status of the period that contains that date.
- id: R204
  defines: vendor_approved/1
  meaning: 'vendor_approved(R): R''s vendor is approved on R''s governing date.'
  class: temporal
  conservative: true
  owner: null
  rule: A request's vendor is approved for it if the vendor's status on the request's governing date is approved.
- id: R205
  defines: cc_on/4
  meaning: 'cc_on(E, C, Src, D): according to source Src, employee E belongs to C on date D.'
  class: temporal
  conservative: true
  owner: null
  rule: According to a source, an employee belongs on a date to the cost centre of that source's latest assignment record effective on or before that date.
- id: R206
  defines: disputed_on/2
  meaning: 'disputed_on(E, D): hr and finance disagree about E''s cost centre on date D.'
  class: fitness
  conservative: true
  owner: null
  rule: An employee's cost centre is disputed on a date if hr and finance place them in different cost centres on that date.
- id: R207
  defines: exemption_in_force/3
  meaning: 'exemption_in_force(X, Cat, D): exemption X for category Cat applies on date D.'
  class: temporal
  conservative: true
  owner: null
  rule: An exemption is in force on a date if it was granted on or before that date and not withdrawn on or before that date.
- id: R301
  defines: approver/2
  meaning: 'approver(R, M): M may approve request R.'
  class: entitlement
  conservative: false
  owner: procurement
  rule: Someone may approve a request if they are in the requester's reporting chain and their role's approval limit on the request's governing date is at least the request amount.
- id: R302
  defines: has_approver/1
  meaning: 'has_approver(R): someone may approve R.'
  class: definitional
  conservative: true
  owner: null
  rule: A request has an approver if someone may approve it.
- id: R303
  defines: exempt/1
  meaning: 'exempt(R): R is exempt from the cap check.'
  class: defeasible
  conservative: false
  owner: cfo
  rule: 'Exception to the cap check: a request is exempt from it if an exemption for its category is in force on its governing date.'
- id: R304
  defines: cap_ok/1
  meaning: 'cap_ok(R): R passes the cap check.'
  class: defeasible
  conservative: false
  owner: controller
  rule: A request passes the cap check if it breaches no cap or is exempt from the cap check.
- id: R305
  defines: vendor_cleared/1
  meaning: 'vendor_cleared(R): R passes the vendor check.'
  class: material_inference
  conservative: false
  owner: procurement
  rule: A request passes the vendor check if its vendor is approved for it, or if the emergency waiver applies to it.
- id: R306
  defines: waiver/1
  meaning: 'waiver(R): R''s suspended vendor is waived because R is an emergency.'
  class: defeasible
  conservative: false
  owner: procurement
  rule: 'Exception to the vendor check: an emergency request whose vendor is suspended on its governing date is waived through the vendor check.'
- id: R307
  defines: waiver_blocked/1
  meaning: 'waiver_blocked(R): the emergency waiver does not apply to R.'
  class: defeasible
  conservative: false
  owner: compliance
  rule: 'Exception to the emergency waiver: the waiver does not apply to a big capital request.'
- id: R308
  defines: eligible/1
  meaning: 'eligible(R): R has an approver, passes the cap check and passes the vendor check.'
  class: material_inference
  conservative: false
  owner: procurement
  rule: A request is eligible if it has an approver, passes the cap check and passes the vendor check.
- id: R309
  defines: denied/1
  meaning: 'denied(R): R is denied.'
  class: incompatibility
  conservative: false
  owner: compliance
  rule: A request is denied if its requester has a recorded policy violation.
- id: R310
  defines: approved/1
  meaning: 'approved(R): R is approved.'
  class: material_inference
  conservative: false
  owner: procurement
  rule: A request is approved if it is eligible and not denied. Denial overrides eligibility.
- id: R311
  defines: auto_approved/1
  meaning: 'auto_approved(R): R is approved automatically.'
  class: entitlement
  conservative: false
  owner: procurement
  rule: A software request under 10000 is approved automatically, without further checks.
- id: R312
  defines: approved/1
  meaning: 'approved(R): R is approved.'
  class: entitlement
  conservative: false
  owner: procurement
  rule: An automatically approved request is approved.
- id: R313

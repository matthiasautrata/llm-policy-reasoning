id: https://example.org/llm-policy-reasoning/spike-v3/slice
name: slice
title: Spike v3 System A slice
description: >-
  Physical model, semantic layer, vocabulary, rules and Toulmin claims of the spike v3 procurement slice.
  Detail data is not part of the model: it stays relational and is reached through fetch(concept, filters).
  Rule heads, bodies and claim assertions are structured (Literal and RuleTerm classes below), so the schema
  validates the rule language, not just the envelope.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  slice: https://example.org/llm-policy-reasoning/spike-v3/slice/
default_prefix: slice
default_range: string
imports:
  - linkml:types

classes:
  Slice:
    tree_root: true
    description: The whole slice, as authored in shared/slice.edn.
    slots: [version, today, assets, tables, concepts, terms, code_lists, taxonomies, functional, rules, claims]

  Asset:
    description: Anything significant a claim can attach to that is not a table, column, concept or term.
    slots: [id, kind, doc]
    slot_usage:
      kind: {range: AssetKind, required: true}

  Table:
    description: A physical table of the detail data.
    slots: [id, name, doc, columns]
    slot_usage:
      id: {pattern: "^table:[a-z_]+$"}

  Column:
    description: A column of a physical table.
    slots: [id, name, column_type, doc]
    slot_usage:
      id: {pattern: "^col:[a-z_]+/[a-z_]+$"}

  Concept:
    description: >-
      A semantic-layer entry (measure, dimension, entity or hierarchy) bound to tables. Its SQL template
      uses $name for required parameters and @iso(x) for an ISO date string; other filters are applied
      around the template. A derived concept has no SQL and names the rule that computes it.
    slots: [id, concept_name, kind, doc, tables, params, columns_out, sql, batch_sql, derived_by, additivity, unsafe_dims]
    slot_usage:
      kind: {range: ConceptKind, required: true}
      tables: {range: string, required: true, inlined: false, description: Ids of the tables the concept binds to.}
    # PLAN-v3-integrity §1.3: every measure declares its additivity (no default); semi-additive names the
    # dimensions it must not be summed over. On Concept, not Measure: the concepts range admits Concept
    # itself, so a measure missing the slot would still validate as a plain Concept.
    rules:
      - preconditions: {slot_conditions: {kind: {equals_string: measure}}}
        postconditions: {slot_conditions: {additivity: {required: true}}}
      - preconditions: {slot_conditions: {additivity: {equals_string: semi-additive}}}
        postconditions: {slot_conditions: {unsafe_dims: {required: true}}}
      - preconditions: {slot_conditions: {batch_sql: {required: true}}}
        postconditions: {slot_conditions: {sql: {required: true}, params: {required: true}}}
    # A class-level any_of, not a `rules` entry: gen-json-schema turns a rule without preconditions into a bare
    # JSON Schema `then` (no `if`), which validators ignore (PLAN-v3a-fix Decisions, F2.3).
    any_of: &sql_or_derived
      - slot_conditions: {sql: {required: true}}
      - slot_conditions: {derived_by: {required: true}}

  Measure:
    is_a: Concept
    description: A concept whose kind is measure (an aggregate over the detail data).
    # class-level any_of is not inherited through is_a (gen-json-schema emits it on Concept only, and the
    # concepts range admits descendants), so it is repeated here and on Dimension.
    any_of: *sql_or_derived
  Dimension:
    is_a: Concept
    description: A concept whose kind is dimension.
    any_of: *sql_or_derived

  Term:
    description: A vocabulary term with a contrastive definition (X, as opposed to Y, differing in Z).
    slots: [id, label, synonyms, owner, concept, see, definition]
    slot_usage:
      id: {pattern: "^term:[a-z_]+$"}
      definition: {required: true}
      owner: {required: true}

  CodeList:
    description: The admissible codes of an enumerated column.
    slots: [id, values]

  Taxonomy:
    description: A two-level grouping over a code list.
    slots: [id, code_list, groups]

  TaxonomyGroup:
    slots: [group, members]

  FunctionalPredicate:
    description: >-
      A predicate whose first key_arity arguments are a key and whose last argument is a value; two
      conclusions with the same key and different values compete as p and ~p do.
    slots: [pred, key_arity]

  Rule:
    description: >-
      A rule envelope. kind strict, defeasible or defeater carries head and body; superiority carries
      pred and order (asserter authority); incompatible carries head and body (head excluded when body holds).
    slots: [id, kind, owner, rule_class, conservative, layer, doc, head, body, superior_to, pred, order, recorded_at,
            completeness, closed_over]
    slot_usage:
      id: {pattern: "^R[0-9]+$"}
      kind: {range: RuleKind, required: true}
      owner: {required: true}
      recorded_at: {required: true}
    rules:
      - preconditions: {slot_conditions: {kind: {equals_string: superiority}}}
        postconditions: {slot_conditions: {pred: {required: true}, order: {required: true}}}
      - preconditions: {slot_conditions: {kind: {any_of: [{equals_string: strict}, {equals_string: defeasible}, {equals_string: defeater}, {equals_string: incompatible}]}}}
        postconditions: {slot_conditions: {head: {required: true}}}

  Claim:
    description: >-
      A Toulmin claim: an assertion about an asset by an asserter, in force from valid_from to valid_to
      (inclusive; open when absent), with warrant, backing and qualifier. Claims are flat
      (PLAN-v3-integrity §1.1): a claim holds only if every depends_on member holds (a failing one rebuts
      it); a failing supports member leaves it holding with a qualifier that lists it. Each claim carries
      its own asserter and times; nothing is inherited. recorded_at is provenance (when the record entered
      the store), not evidence.
    slots: [id, about, assertion, asserted_by, asserted_at, valid_from, valid_to, warrant, backing, qualifier,
            depends_on, supports, recorded_at]
    slot_usage:
      id: {pattern: "^C[0-9]+(\\.[0-9]+)?$"}
      about: {required: true}
      assertion: {required: true}
      asserted_by: {required: true}
      asserted_at: {required: true}
      valid_from: {required: true}
      recorded_at: {required: true}

  # ---------------------------------------------------------------- the rule language (slice.edn header)
  # Each literal and term is an object whose `type` names its class (designates_type). Classes are closed, so
  # a form with too many positions (edn2yaml puts them in `extra`) or a wrong part is rejected.

  Literal:
    abstract: true
    description: A literal of a rule head or body, or a claim assertion.
    attributes:
      type: {designates_type: true, range: string, required: true}
  Derived:
    is_a: Literal
    description: "[:pred arg ...]: another rule's head, or a claim."
    attributes:
      pred: {required: true, pattern: "^[a-z_]+$"}
      args: {range: RuleTerm, multivalued: true, inlined_as_list: true}
  Fetch:
    is_a: Literal
    description: "[:fetch :concept {col term} {col ?var}]: a concept lookup; bound terms filter, variables bind."
    attributes:
      concept: {required: true, pattern: "^[a-z_]+$"}
      filters: {range: Filter, multivalued: true, inlined: true, required: true}
      outputs: {range: Output, multivalued: true, inlined: true, required: true}
  Filter:
    description: "One entry of a fetch filter map (compact form `column: term`)."
    attributes:
      column: {key: true}
      term: {range: RuleTerm, required: true, inlined: true}
  Output:
    description: "One entry of a fetch output map (compact form `column: ?var`)."
    attributes:
      column: {key: true}
      var: {required: true, pattern: "^\\?[A-Za-z_][A-Za-z0-9_]*$"}
  Not:
    is_a: Literal
    description: "[:not literal]: the literal is not defeasibly provable."
    attributes:
      literal: {range: Literal, required: true, inlined: true}
  Neg:
    is_a: Literal
    description: "[:neg literal]: the complement (defeater heads, negative claims)."
    attributes:
      literal: {range: Literal, required: true, inlined: true}
  Comparison:
    is_a: Literal
    description: "[:< a b] and friends: numbers or ISO dates."
    attributes:
      op: {range: ComparisonOp, required: true}
      left: {range: RuleTerm, required: true, inlined: true}
      right: {range: RuleTerm, required: true, inlined: true}
  Is:
    is_a: Literal
    description: "[:is ?x [:+ a b]]: arithmetic."
    attributes:
      var: {range: Var, required: true, inlined: true}
      expr: {range: Expr, required: true, inlined: true}
  Aggregate:
    is_a: Literal
    description: "[:agg :sum ?x [literal ...] ?out]: sum or count of ?x over the proven solutions of the conjunction (SEMANTICS.md, Aggregates)."
    attributes:
      op: {range: AggregateOp, required: true}
      var: {range: Var, required: true, inlined: true}
      body: {range: Literal, multivalued: true, inlined_as_list: true, required: true}
      out: {range: Var, required: true, inlined: true}
  AsOf:
    is_a: Literal
    description: "[:as_of ?d]: the evaluation date."
    attributes:
      date: {range: RuleTerm, required: true, inlined: true}

  RuleTerm:
    abstract: true
    description: An argument of a literal (named RuleTerm because Term is the vocabulary class).
    attributes:
      type: {designates_type: true, range: string, required: true}
  Var:
    is_a: RuleTerm
    attributes:
      name: {required: true, pattern: "^\\?[A-Za-z_][A-Za-z0-9_]*$", description: "Variables start with ?."}
  Str:
    is_a: RuleTerm
    attributes:
      value: {required: true}
  Int:
    is_a: RuleTerm
    attributes:
      value: {range: integer, required: true}
  Bool:
    is_a: RuleTerm
    attributes:
      value: {range: boolean, required: true}
  Expr:
    is_a: RuleTerm
    description: "[:+ a b] or [:- a b]; exactly two operands."
    attributes:
      op: {range: ArithmeticOp, required: true}
      left: {range: RuleTerm, required: true, inlined: true}
      right: {range: RuleTerm, required: true, inlined: true}

slots:
  id: {identifier: true, required: true}
  version: {range: integer}
  today: {range: date, required: true}
  name: {}
  concept_name: {description: The concept's name as rules reference it in fetch literals.}
  doc: {}
  kind: {}
  column_type: {range: ColumnType}
  assets: {range: Asset, multivalued: true, inlined_as_list: true}
  tables: {range: Table, multivalued: true, inlined_as_list: true}
  columns: {range: Column, multivalued: true, inlined_as_list: true}
  concepts: {range: Concept, multivalued: true, inlined_as_list: true}
  terms: {range: Term, multivalued: true, inlined_as_list: true}
  code_lists: {range: CodeList, multivalued: true, inlined_as_list: true}
  taxonomies: {range: Taxonomy, multivalued: true, inlined_as_list: true}
  functional: {range: FunctionalPredicate, multivalued: true, inlined_as_list: true}
  rules: {range: Rule, multivalued: true, inlined_as_list: true}
  claims: {range: Claim, multivalued: true, inlined_as_list: true}
  params: {multivalued: true}
  columns_out: {multivalued: true, description: Output columns of the concept's rows.}
  sql: {}
  batch_sql: {description: "The set form of sql for its one required parameter $p, written IN ($p), with $p among the output columns (CONTRACT.md, Aggregates)."}
  derived_by: {range: string, pattern: "^R[0-9]+$"}
  label: {required: true}
  synonyms: {multivalued: true}
  owner: {range: Owner}
  concept: {range: string, pattern: "^(measure|dim|entity|hier):[a-z_]+$"}
  see: {multivalued: true, range: string}
  definition: {}
  values: {multivalued: true, required: true}
  code_list: {range: string, pattern: "^codes:[a-z_]+$"}
  groups: {range: TaxonomyGroup, multivalued: true, inlined_as_list: true}
  group: {}
  members: {multivalued: true}
  pred: {}
  key_arity: {range: integer, minimum_value: 1}
  rule_class: {range: RuleClass}
  conservative: {range: boolean}
  layer: {}
  head: {range: Literal, inlined: true, description: "A literal, e.g. [:headroom ?c ?h]."}
  body: {range: Literal, multivalued: true, inlined_as_list: true, description: "Literals, evaluated left to right."}
  superior_to: {multivalued: true, range: string, pattern: "^R[0-9]+$"}
  order: {multivalued: true, range: Owner, description: "Asserter authority, strongest first."}
  assertion: {range: Literal, inlined: true, description: "A literal, e.g. [:cost_centre_of \"e077\" \"cc0078\"]."}
  asserted_by: {range: Owner}
  asserted_at: {range: date}
  valid_from: {range: date}
  valid_to: {range: date}
  warrant: {range: string, pattern: "^R[0-9]+$"}
  backing: {}
  qualifier: {range: Modal}
  about: {range: string, pattern: "^[a-z]+:[A-Za-z0-9_/]+$"}
  depends_on: {multivalued: true, range: string, pattern: "^C[0-9]+(\\.[0-9]+)?$", description: Claim ids this claim requires.}
  supports: {multivalued: true, range: string, pattern: "^C[0-9]+(\\.[0-9]+)?$", description: Claim ids that support this claim.}
  recorded_at: {range: date, description: "When the record entered the store (provenance; no rule body reads it)."}
  completeness: {multivalued: true, range: string, pattern: "^C[0-9]+(\\.[0-9]+)?$", description: "IR-005: completeness claims (predicate complete) for the scope of the rule's :not / measure fetch."}
  closed_over: {range: ClosedOver, description: "IR-005: the rule's :not / measure fetch reads only the known facts; decide qualifies the answer."}
  additivity: {range: Additivity}
  unsafe_dims: {multivalued: true, range: string, description: "Dimensions a semi-additive measure must not be summed over."}

enums:
  AssetKind: {permissible_values: {vendor: {}, employee: {}}}
  ColumnType: {permissible_values: {id: {}, int: {}, enum: {}, bool: {}, date: {}}}
  ConceptKind: {permissible_values: {entity: {}, dimension: {}, hierarchy: {}, measure: {}}}
  RuleKind: {permissible_values: {strict: {}, defeasible: {}, defeater: {}, superiority: {}, incompatible: {}}}
  RuleClass:
    permissible_values: {definition: {}, material_inference: {}, exception: {}, entitlement: {}, superiority: {}, incompatibility: {}}
  Owner: {permissible_values: {finance: {}, hr: {}, procurement: {}, compliance: {}, risk: {}, controller: {}}}
  Modal: {permissible_values: {certainly: {}, presumably: {}}}
  ClosedOver: {permissible_values: {known_facts: {}}}
  Additivity: {permissible_values: {additive: {}, semi-additive: {}, non-additive: {}, unknown: {}}}
  AggregateOp: {permissible_values: {sum: {}, count: {}}}
  ComparisonOp: {permissible_values: {"<": {}, "<=": {}, ">": {}, ">=": {}, "=": {}}}
  ArithmeticOp: {permissible_values: {"+": {}, "-": {}}}

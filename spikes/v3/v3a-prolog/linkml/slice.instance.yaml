- id: hier:ancestors_or_self
  kind: hierarchy
  tables:
  - table:cc
  doc: A cost centre and every ancestor up to the root (the centres a request is charged against).
  params:
  - cc
  sql: WITH RECURSIVE up(cc, id, parent, depth) AS (SELECT id, id, parent, 0 FROM cc WHERE id IN ($cc) UNION ALL SELECT u.cc,
    c.id, c.parent, u.depth + 1 FROM cc c JOIN up u ON c.id = u.parent) SELECT cc, id AS anc, depth FROM up
  concept_name: ancestors_or_self
  columns_out:
  - cc
  - anc
  - depth
- id: hier:subtree
  kind: hierarchy
  tables:
  - table:cc
  doc: A cost centre and all its descendants.
  params:
  - root
  sql: WITH RECURSIVE sub(root, id) AS (SELECT id, id FROM cc WHERE id IN ($root) UNION ALL SELECT s.root, c.id FROM cc c
    JOIN sub s ON c.parent = s.id) SELECT root, id FROM sub
  concept_name: subtree
  columns_out:
  - root
  - id
- id: hier:reporting_chain
  kind: hierarchy
  tables:
  - table:emp
  doc: An employee's manager, the manager's manager, and so on; not the employee.
  params:

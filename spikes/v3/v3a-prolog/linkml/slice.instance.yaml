terms:
- id: term:booked_total
  label: booked total
  synonyms:
  - total booked
  - booked spend
  owner: finance
  concept: measure:booked_total
  definition: The booked total of a cost centre, as opposed to its booked amount, differs in counting the bookings of every
    descendant centre, not only those made directly on it.
- id: term:booked_amount
  label: booked amount
  synonyms:
  - direct booking
  owner: finance
  concept: dim:cost_centre
  definition: The booked amount of a cost centre, as opposed to its booked total, is only what is booked directly on that
    centre.
- id: term:committed_spend
  label: committed spend
  synonyms:
  - commitments
  owner: finance
  definition: Committed spend, as opposed to booked total, differs in whether pending requests count. Finance has not decided
    which; no rule defines it.
- id: term:headroom
  label: headroom
  synonyms:
  - remaining budget
  owner: finance
  concept: measure:headroom
  definition: Headroom, as opposed to cap, is what remains of the cap after the booked total (R105).
- id: term:pending_exposure
  label: pending exposure
  synonyms:
  - pending total
  owner: finance
  concept: measure:pending_exposure
  definition: Pending exposure, as opposed to booked total, sums requests not yet booked (pending, not cancelled).
- id: term:cost_centre
  label: cost centre
  synonyms:
  - cc
  - budget centre
  owner: finance
  concept: dim:cost_centre
  definition: 'A cost centre, as opposed to an org unit, is a node of the budget tree: caps and bookings roll up along it.'
- id: term:org_unit
  label: org unit
  synonyms:
  - organisational unit
  - unit
  owner: hr
  concept: dim:org_unit
  definition: An org unit, as opposed to a cost centre, is a flat grouping of centres (delivery, support, leadership); nothing
    rolls up along it.
- id: term:department
  label: department
  synonyms: []
  owner: hr
  see:
  - term:cost_centre
  - term:org_unit
  definition: Used in practice for both a cost centre and an org unit; resolve to one of them before use.
- id: term:approval_limit
  label: approval limit
  synonyms:
  - signing limit
  owner: procurement
  concept: entity:role_limit_version
  definition: A role's approval limit, as opposed to a cap, bounds a single request an approver may sign, not a centre's spend;
    dated (R202, R203).
- id: term:vendor_status
  label: vendor status
  synonyms: []
  owner: procurement
  concept: entity:vendor_status
  definition: A vendor's status, as opposed to its fitness claims, is the dated register entry (approved or suspended).
- id: term:request
  label: purchase request
  synonyms:
  - request
  - requisition
  owner: procurement
  concept: entity:request
  definition: A purchase request, as opposed to a booking, is spend not yet committed.

  rule_class: material_inference
  recorded_at: '2026-09-14'
  doc: A request has an approver if someone in the requester's reporting chain has a governing limit of at least the amount.
  head:
    type: Derived
    pred: has_approver
    args:
    - type: Var
      name: ?r
  body:
  - type: Fetch
    concept: request
    filters:
      id:
        type: Var
        name: ?r
    outputs:
      requester: ?e
      amount: ?a
  - type: Fetch
    concept: reporting_chain
    filters:
      emp:
        type: Var
        name: ?e
    outputs:
      role: ?role
  - type: Derived
    pred: governing_limit
    args:
    - type: Var
      name: ?r
    - type: Var
      name: ?role
    - type: Var
      name: ?l
  - type: Comparison
    op: '>='
    left:
      type: Var
      name: ?l
    right:
      type: Var
      name: ?a

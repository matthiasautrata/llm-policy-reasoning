- id: measure:booked_total
  kind: measure
  tables:
  - table:cc
  additivity: semi-additive
  unsafe_dims:
  - cost_centre
  doc: Sum of the spend booked directly on every cost centre in the subtree of a centre (zero where nothing is booked).
  params:
  - cc
  sql: WITH RECURSIVE sub(root, id) AS (SELECT id, id FROM cc WHERE id IN ($cc) UNION ALL SELECT s.root, c.id FROM cc c JOIN
    sub s ON c.parent = s.id) SELECT sub.root AS cc, CAST(COALESCE(SUM(cc.booked), 0) AS BIGINT) AS value FROM sub JOIN cc
    ON cc.id = sub.id GROUP BY sub.root
  concept_name: booked_total
  columns_out:
  - cc
  - value
- id: measure:pending_exposure
  kind: measure
  tables:
  - table:req
  - table:emp
  - table:cc
  additivity: semi-additive
  unsafe_dims:
  - cost_centre
  doc: Sum of the amounts of pending requests whose requester's cost centre lies in the subtree of a centre.
  params:
  - cc
  sql: WITH RECURSIVE sub(root, id) AS (SELECT id, id FROM cc WHERE id IN ($cc) UNION ALL SELECT s.root, c.id FROM cc c JOIN
    sub s ON c.parent = s.id) SELECT sub.root AS cc, CAST(COALESCE(SUM(r.amount), 0) AS BIGINT) AS value FROM sub LEFT JOIN
    emp e ON e.cc = sub.id LEFT JOIN req r ON r.requester = e.id AND r.status = 'pending' GROUP BY sub.root
  concept_name: pending_exposure
  columns_out:
  - cc
  - value

id: https://example.org/llm-policy-reasoning/spike-v3/physical
name: physical
prefixes:
  linkml: https://w3id.org/linkml/
imports:
- linkml:types
default_range: string
classes:
  cc:
    description: 'A cost centre: a node of the budget tree, with its spending cap and the spend booked directly on it this
      quarter.'
    attributes:
      id:
        range: string
        description: Cost centre id.
      parent:
        range: string
        description: Parent cost centre; empty for the root.
      level:
        range: integer
        description: Depth in the tree; the root is 0.
      org_unit:
        range: string
        description: Organisational unit the centre belongs to.
      booked:
        range: integer
        description: Spend booked directly on this centre (not its descendants).
      cap:
        range: integer
        description: Spending cap of the centre this quarter.
  emp:
    description: An employee, their role, their cost centre as finance records it, and their direct manager.
    attributes:
      id:
        range: string
        description: Employee id.
      role:
        range: string
        description: Role; governs the approval limit.
      cc:
        range: string
        description: Current cost centre in the finance system.
      manager:
        range: string
        description: Direct manager; empty for the vp.
      violation:
        range: boolean
        description: The employee has a recorded policy violation.
  req:
    description: A purchase request, raised on a date by an employee, for an amount, category and vendor.
    attributes:
      id:
        range: string
        description: Request id.
      requester:
        range: string
        description: Employee who raised the request.
      amount:
        range: integer
        description: Amount requested.
      category:
        range: string
        description: Spend category (code list codes:category).
      vendor:
        range: string
        description: Vendor the purchase is from.
      date:
        range: date
        description: Date the request was raised; governs dated rules (R203).
      status:
        range: string
        description: pending or cancelled.
      emergency:
        range: boolean
        description: Flagged as an emergency.
  assignment:
    description: A source's record (hr or finance) that an employee belongs to a cost centre from the effective date on.
    attributes:
      emp:
        range: string
        description: Employee.
      cc:
        range: string
        description: Cost centre.
      source:
        range: string
        description: hr or finance.
      effective:
        range: date
        description: Effective from.
  role_limit_version:
    description: A dated version of a role's approval limit, valid from and to the given dates inclusive.
    attributes:
      role:
        range: string
        description: Role.
      limit:
        range: integer
        description: Approval limit.
      valid_from:
        range: date
        description: First day valid.
      valid_to:
        range: date
        description: Last day valid.
  vendor_status:
    description: A vendor's status during a period, from and to the given dates inclusive.
    attributes:
      vendor:
        range: string
        description: Vendor.
      status:
        range: string
        description: approved or suspended.
      valid_from:
        range: date
        description: First day.
      valid_to:
        range: date
        description: Last day.
